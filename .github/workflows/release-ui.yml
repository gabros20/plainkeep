name: release-ui

# ┌──────────────────────────────────────────────────────────────────────────────────────────────┐
# │ NON-FUNCTIONAL as of the hybrid-core Phase 1 branch — DO NOT push a `ui-v*` tag expecting a   │
# │ release. Every path below still says `ui/`, and `ui/` was deleted when its TypeScript moved   │
# │ into `cli/` (ADR-013, Phase 1 Task 1). The first real step fails immediately:                 │
# │   FileNotFoundError: [Errno 2] No such file or directory: 'ui/package.json'                   │
# │ and `working-directory: ui` on the steps after it cannot resolve either.                      │
# │                                                                                               │
# │ This file was left byte-identical on purpose rather than repointed: it is tag-triggered, so   │
# │ it could not fire during that work, and Phase 2/3 owns the decision of whether the floor's    │
# │ separately-downloaded `plainkeep-ui` survives at all. Until one of those happens, the floor's │
# │ `plainkeep-ui` CANNOT BE RE-RELEASED — `plainkeep setup ui --yes` can still install the LAST  │
# │ published asset, and a contributor checkout still builds from source                          │
# │ (`cd cli && bun run build:ui`), but there is no way to cut a new release.                     │
# │                                                                                               │
# │ To revive it: repoint `ui/package.json` → `cli/package.json`, `ui/src/version.ts` →           │
# │ `cli/src/tui/version.ts`, `working-directory: ui` → `cli`, and pin `bun-version-file:`        │
# │ `.bun-version` instead of `latest` (the core binary needs bun >= 1.2.21; `latest` is how the  │
# │ artifact users install ends up on an unpinned toolchain).                                     │
# └──────────────────────────────────────────────────────────────────────────────────────────────┘
#
# Ships the plainkeep-ui terminal binary (ADR-011). Push a `ui-v*` tag and this cross-compiles ui/
# into self-contained binaries (no Node/Bun needed on the user's machine) + a checksums.txt, attached
# to a GitHub release. Vaults install the matching asset via `plainkeep setup ui --yes`, which
# downloads with the authenticated gh CLI (the template repo may be private) and verifies the sha256.
#
# Release ritual (from a clean, green main):
#   git tag ui-v0.1.0 && git push origin ui-v0.1.0

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version consistency (tag == package.json == bin/ui/version.txt == src/version.ts)
        run: |
          tag="${GITHUB_REF_NAME#ui-v}"
          pkg="$(python3 -c "import json; print(json.load(open('ui/package.json'))['version'])")"
          eng="$(tr -d ' \n' < bin/ui/version.txt)"
          src="$(grep -o '"[0-9][0-9.]*"' ui/src/version.ts | tr -d '"')"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$eng" ] || [ "$tag" != "$src" ]; then
            echo "version drift: tag=$tag package.json=$pkg bin/ui/version.txt=$eng src/version.ts=$src"
            echo "all four must match — vaults pin their download to bin/ui/version.txt"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install ui deps
        run: bun install --frozen-lockfile || bun install
        working-directory: ui
      - name: typecheck
        run: bunx tsc --noEmit
        working-directory: ui
      - name: cross-compile binaries
        working-directory: ui
        run: |
          mkdir -p ../dist-bin
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --minify --target="bun-${target}" src/index.ts \
              --outfile "../dist-bin/plainkeep-ui-${target}"
          done
      - name: checksums
        working-directory: dist-bin
        run: shasum -a 256 plainkeep-ui-* > checksums.txt && cat checksums.txt
      - name: smoke (linux-x64 binary honors the non-TTY contract)
        run: |
          set +e
          out="$(./dist-bin/plainkeep-ui-linux-x64 </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "expected non-TTY exit 2, got $code"
            exit 1
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-bin/* \
            --title "$GITHUB_REF_NAME" \
            --notes "plainkeep-ui terminal binaries (self-contained; no Node required). Install into a vault with: plainkeep setup ui --yes"
