name: release-ui

# Ships the plainkeep-ui terminal binary (ADR-011). Push a `ui-v*` tag and this cross-compiles the
# TUI — `cli/src/tui`, where it landed when the standalone `ui/` workspace was absorbed into `cli/`
# (ADR-013, hybrid-core Phase 1 Task 1) — into self-contained binaries (no Node/Bun needed on the
# user's machine) + a checksums.txt, attached to a GitHub release. Vaults install the matching asset
# via `plainkeep setup ui --yes`, which downloads with the authenticated gh CLI (the template repo
# may be private) and verifies the sha256.
#
# Release ritual (from a clean, green main):
#   git tag ui-v0.2.0 && git push origin ui-v0.2.0

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: version consistency (tag == the engine-owned pin == cli/src/tui/version.ts)
        # The rule used to live here, as an inline shell snippet. That is why it could sit stale for a
        # whole phase: a tag-triggered workflow runs only when someone cuts a release, so nothing ever
        # executed it, and its `sed` parser — which yields the empty string on a reformatted
        # declaration, and compares nothing against nothing — had no test at all.
        #
        # It now lives in `test/run_uirelease.py`, which the offline batch runs on EVERY push and
        # which proves on every run that it goes red on each of the ways the three can disagree.
        # Passing the tag here adds the one leg a batch run cannot have. Two files, not three, on the
        # source side: `cli/package.json`'s "version" is the core workspace's own (0.0.0, the Phase-1
        # skeleton), not the TUI's — re-adding it would fail every release.
        run: python3 test/run_uirelease.py --tag "$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to .bun-version, the same way ci.yml pins it, and never `latest`: this workflow
          # builds the artifact a floor user actually installs, so it must come off the toolchain
          # the source was tested against in CI rather than whatever shipped that week.
          bun-version-file: .bun-version
      - name: install cli deps
        run: bun install --frozen-lockfile || bun install
        working-directory: cli
      - name: typecheck
        run: bun run typecheck
        working-directory: cli
      - name: cross-compile binaries
        # cli/'s `build:ui` script is the contributor one-liner — host target only, fixed outfile
        # (../.local/bin/plainkeep-ui). A release needs four targets under per-platform asset names
        # (setuplib maps uname → `plainkeep-ui-<target>`), so the matrix stays here; the entry point
        # and compile flags are otherwise the same binary CI smoke-tests.
        working-directory: cli
        run: |
          mkdir -p ../dist-bin
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --minify --target="bun-${target}" src/tui/index.ts \
              --outfile "../dist-bin/plainkeep-ui-${target}"
          done
      - name: checksums
        working-directory: dist-bin
        run: shasum -a 256 plainkeep-ui-* > checksums.txt && cat checksums.txt
      - name: smoke (linux-x64 binary honors the non-TTY contract)
        run: |
          set +e
          out="$(./dist-bin/plainkeep-ui-linux-x64 </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "expected non-TTY exit 2, got $code"
            exit 1
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-bin/* \
            --title "$GITHUB_REF_NAME" \
            --notes "plainkeep-ui terminal binaries (self-contained; no Node required). Install into a vault with: plainkeep setup ui --yes"
