name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap-hash:
    # The install funnel's integrity ritual (README + script/get) tells a user to compare their
    # downloaded get.sh against the published script/get.sh.sha256. This job keeps that promise real:
    # it recomputes the hash and FAILS if the committed file drifted from script/get — a detection
    # gate that teaches the exact regeneration command. It NEVER commits or pushes (CI mutating the
    # repo would be its own footgun); fixing a mismatch is the author's one-liner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify script/get.sh.sha256 matches script/get
        run: |
          if [ ! -f script/get.sh.sha256 ]; then
            echo "script/get.sh.sha256 is missing — regenerate it:"
            echo "  shasum -a 256 script/get | awk '{print \$1\"  get.sh\"}' > script/get.sh.sha256"
            exit 1
          fi
          actual="$(shasum -a 256 script/get | awk '{print $1}')"
          published="$(awk '{print $1}' script/get.sh.sha256)"
          if [ "$actual" != "$published" ]; then
            echo "script/get.sh.sha256 is STALE (script/get changed but the hash wasn't updated)."
            echo "  published: $published"
            echo "  actual:    $actual"
            echo "regenerate and commit:"
            echo "  shasum -a 256 script/get | awk '{print \$1\"  get.sh\"}' > script/get.sh.sha256"
            exit 1
          fi
          echo "ok: script/get.sh.sha256 matches script/get ($actual)"

  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ensure a local `main` ref
        # test/run_setup.py's update cases CLONE this checkout and run `script/update --branch main`
        # against it. On a push build HEAD *is* main so the clone gets it for free; on a PULL_REQUEST
        # build actions/checkout leaves a detached merge ref with no refs/heads/main, the clone has
        # no main to merge from, and those cases fail for a reason that has nothing to do with the
        # change under review. (They were red on every PR, green on every push, long before this
        # step existed.) Fetch it only when it is genuinely absent, so push builds are untouched.
        run: |
          git show-ref --verify --quiet refs/heads/main \
            || git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
      - name: git identity (suites create temp repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "plainkeep-ci"
          git config --global init.defaultBranch main
      - name: run offline test suites
        run: |
          if [ -f test/run_all.py ]; then
            python3 test/run_all.py
          else
            echo "lean vault — no test harness, nothing to run"
          fi

  ui:
    # The TS core-binary workspace (cli/, ADR-011 + hybrid-core Phase 1). Typecheck + unit tests +
    # compile smoke: the same `bun build --compile` the release workflow ships must produce a
    # plainkeep-ui binary that honors the non-TTY contract (exit 2, pointing at
    # `plainkeep <verb> --json`) — testable headlessly without a plainkeep vault. Also compiles the
    # plainkeep-core binary and then RUNS the differential oracle against it (below), which is the
    # only place that oracle runs at all: the offline-suites job has no bun, so the binary is absent
    # there and run_core_parity.py takes its SKIP branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ensure a local `main` ref
        # test/run_setup.py's update cases CLONE this checkout and run `script/update --branch main`
        # against it. On a push build HEAD *is* main so the clone gets it for free; on a PULL_REQUEST
        # build actions/checkout leaves a detached merge ref with no refs/heads/main, the clone has
        # no main to merge from, and those cases fail for a reason that has nothing to do with the
        # change under review. (They were red on every PR, green on every push, long before this
        # step existed.) Fetch it only when it is genuinely absent, so push builds are untouched.
        run: |
          git show-ref --verify --quiet refs/heads/main \
            || git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`, and matching .bun-version. The core binary inverts a bun defect
          # (signal naming) and pins bun's signal DELIVERY behavior per signal, both measured on this
          # exact version — `latest` would silently revalidate them against whatever shipped that
          # week, which is the opposite of a pin.
          bun-version-file: .bun-version
      - uses: actions/setup-python@v5
        # The Python oracle and the two suite runs below need the same interpreter offline-suites
        # uses, rather than whatever the runner image happens to ship.
        with:
          python-version: "3.11"
      - name: install cli deps
        run: bun install --frozen-lockfile || bun install
        working-directory: cli
      - name: typecheck
        run: bun run typecheck
        working-directory: cli
      - name: test
        run: bun run test
        working-directory: cli
      - name: build core + ui binaries
        working-directory: cli
        run: |
          bun run build
          bun run build:ui
      - name: git identity (the suites create temp repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "plainkeep-ci"
          git config --global init.defaultBranch main
      - name: core-parity differential oracle (the Task 4 acceptance gate)
        # PLAINKEEP_REQUIRE_CORE=1 turns "no binary" from a visible SKIP into a FAILURE, so this step
        # cannot pass by not running. This is the only job with a built binary, and therefore the
        # only place the dispatcher matrix, the shim checks and the signal pins are enforced at all.
        run: PLAINKEEP_REQUIRE_CORE=1 python3 test/run_core_parity.py
      - name: full suite through the CORE (mode pinned)
        # require + an absolute PLAINKEEP_CORE_BIN so even the suites that copy a vault to temp route
        # through the real binary; require makes a missing/dead core exit 1 rather than degrade to
        # the bash floor, so a green run here proves the binary really did the dispatching.
        run: PLAINKEEP_CORE_BIN="$PWD/.local/bin/plainkeep-core" PLAINKEEP_CORE=require python3 test/run_all.py
      - name: full suite through the BASH FLOOR (mode pinned)
        run: PLAINKEEP_CORE=off python3 test/run_all.py
      - name: plainkeep-ui non-TTY contract
        working-directory: cli
        run: |
          set +e
          out="$(../.local/bin/plainkeep-ui </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "expected non-TTY exit 2, got $code"
            exit 1
          fi
